[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-energy-monitor"
dynamic = ["version"]
description = "Local multi-harness token history and offline Tokenatlas reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Magnus Gille" }]
keywords = ["claude", "codex", "opencode", "tokens", "energy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/Magnus-Gille/claude-code-energy-monitor"
Issues = "https://github.com/Magnus-Gille/claude-code-energy-monitor/issues"

[project.scripts]
energy-monitor = "usage.__main__:main"

[tool.setuptools]
packages = ["usage"]
py-modules = ["why"]
include-package-data = true

[tool.setuptools.package-data]
usage = ["report_template.html", "prices.json"]

[tool.setuptools.dynamic]
version = { attr = "usage.__version__" }
